
<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- =====================================================
       PRIMARY SEO
       ===================================================== -->

  <title>WebHarnix | Web Development, SEO & Digital Solutions</title>

  <meta name="description"
    content="WebHarnix builds modern websites, business software, mobile apps, AI automation and SEO solutions that help businesses grow online." />

  <meta name="author" content="WebHarnix" />

  <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />

  <meta name="googlebot" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />

  <meta name="theme-color" content="#050B1C" />

  <!-- =====================================================
       CANONICAL
       ===================================================== -->

  <link rel="canonical" href="https://webharnix.vercel.app/" />

  <!-- =====================================================
       FAVICON
       ===================================================== -->

  <link rel="icon" type="image/png" href="/vite.png" />

  <link rel="apple-touch-icon" href="/vite.png" />

  <!-- =====================================================
       OPEN GRAPH / SOCIAL SHARING
       ===================================================== -->

  <meta property="og:type" content="website" />

  <meta property="og:title" content="WebHarnix | Web Development, SEO & Digital Solutions" />

  <meta property="og:description"
    content="Modern websites, business software, mobile apps, AI automation and SEO solutions for growing businesses." />

  <meta property="og:url" content="https://webharnix.vercel.app/" />

  <meta property="og:site_name" content="WebHarnix" />

  <meta property="og:locale" content="en_IN" />

  <!-- =====================================================
       TWITTER / X
       ===================================================== -->

  <meta name="twitter:card" content="summary" />

  <meta name="twitter:title" content="WebHarnix | Web Development, SEO & Digital Solutions" />

  <meta name="twitter:description"
    content="Modern websites, software, mobile apps, AI automation and SEO solutions for growing businesses." />

  <!-- =====================================================
       GOOGLE STRUCTURED DATA — WEBSITE
       Helps Google understand the official site name.
       ===================================================== -->

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebSite",
    "@id": "https://webharnix.vercel.app/#website",
    "url": "https://webharnix.vercel.app/",
    "name": "WebHarnix",
    "alternateName": "Web Harnix"
  }
  </script>

  <!-- =====================================================
       GOOGLE STRUCTURED DATA — ORGANIZATION
       ===================================================== -->

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Organization",
    "@id": "https://webharnix.vercel.app/#organization",
    "name": "WebHarnix",
    "url": "https://webharnix.vercel.app/",
    "logo": "https://webharnix.vercel.app/vite.png",
    "description": "WebHarnix provides web development, SEO, business software, mobile apps, AI automation and digital solutions for businesses."
  }
  </script>

</head>

<body>

  <div id="root"></div>

  <script type="module" src="/src/main.jsx"></script>

</body>

</html>
